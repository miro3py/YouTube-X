name: Build & Release YouTubeX Tweak

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.7.19)'
        required: true
        default: '1.7.19'
      create_release:
        description: 'Create GitHub release'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build YouTubeX Dylib

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        run: |
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y build-essential git curl grep sed coreutils perl rsync openssh-client openssl bzip2 unzip wget python3

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git ~/theos
          cd ~/theos
          git submodule update --init --recursive

      - name: Download iOS SDK
        run: |
          export THEOS=~/theos
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          wget -q https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* .
          rm -rf sdks-master master.zip

      - name: Build YouTubeX Dylib
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make ARCH=arm64 PACKAGE_SCHEME=roothide package=0

      - name: Create Artifacts Directory
        run: |
          mkdir -p build_artifacts
          export THEOS=~/theos
          
          # Copy dylib
          find $THEOS -name "YouTubeX.dylib" -exec cp {} build_artifacts/ \; 2>/dev/null
          
          # Copy plist
          [ -f "YouTubeX.plist" ] && cp YouTubeX.plist build_artifacts/
          
          # Create build info
          cat > build_artifacts/BUILD_INFO.txt << 'EOF'
          YouTube X Tweak - Build Information
          ======================================
          
          Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Repository: https://github.com/miro3py/YouTube-X
          Version: ${{ inputs.release_version }}
          Build Commit: ${{ github.sha }}
          
          Installation:
          1. Place YouTubeX.dylib in /Library/MobileSubstrate/DynamicLibraries/
          2. Place YouTubeX.plist in /Library/MobileSubstrate/DynamicLibraries/
          3. Respring or reboot device
          
          Requirements:
          - iOS 11.0 or later
          - MobileSubstrate
          - YouTube app
          - com.ps.ytabgoodies
          EOF

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeX-Build
          path: build_artifacts/
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Create Draft Release
    if: ${{ inputs.create_release == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: YouTubeX-Build
          path: release_files/

      - name: Create Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # YouTube X v${{ inputs.release_version }} Release
          
          ## Overview
          A lightweight YouTube improvement tweak for jailbroken iOS devices.
          
          ## Features
          ✨ Ad Removal
          🎬 Background Playback
          🚫 Shorts Removal
          
          ## Installation
          - Download .dylib and .plist files
          - Place in /Library/MobileSubstrate/DynamicLibraries/
          - Respring device
          
          ## Requirements
          - iOS 11.0+
          - Jailbroken device
          - MobileSubstrate
          - YouTube app
          
          **⚠️ This is a draft release.**
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: v${{ inputs.release_version }}
          name: YouTube X v${{ inputs.release_version }}
          body_path: RELEASE_NOTES.md
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
