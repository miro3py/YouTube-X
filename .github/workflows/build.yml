name: Build YouTube-X (.dylib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Install Theos & Dependencies
        run: |
          # Install Theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          # Verify Theos installation
          echo "Theos installed at: $HOME/theos"
          ls -la $HOME/theos/bin/

      - name: Install PSHeader
        run: |
          # Create PSHeader directory if it doesn't exist
          mkdir -p $HOME/theos/include
          
          # Clone PSHeader into temporary directory
          cd /tmp
          git clone https://github.com/PoomSmart/PSHeader.git PSHeader_tmp
          
          # Move PSHeader files to include directory
          cp -r PSHeader_tmp/* $HOME/theos/include/
          rm -rf PSHeader_tmp
          
          # Verify PSHeader installation
          echo "PSHeader files installed:"
          ls -la $HOME/theos/include/ | grep -i header || echo "Headers found"

      - name: Download iOS SDK
        run: |
          # Create SDK directory
          mkdir -p $HOME/theos/sdks
          
          # Download and extract iOS SDK
          echo "Downloading iOS SDK..."
          cd $HOME/theos/sdks
          
          # Try iPhoneOS16.5.sdk first
          if ! curl -LO --fail-with-body https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz; then
            echo "Failed to download iPhoneOS16.5.sdk, trying alternative..."
            curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS15.5.sdk.tar.xz
            tar -xf iPhoneOS15.5.sdk.tar.xz
            rm iPhoneOS15.5.sdk.tar.xz
          else
            tar -xf iPhoneOS16.5.sdk.tar.xz
            rm iPhoneOS16.5.sdk.tar.xz
          fi
          
          # Verify SDK installation
          echo "Available SDKs:"
          ls -la $HOME/theos/sdks/

      - name: Compile Tweak
        env:
          THEOS: ${{ env.THEOS }}
          THEOS_MAKE_PATH: ${{ env.THEOS }}/makefiles
        run: |
          # Export build parameters
          export ARCHS="arm64"
          export TARGET="iphone:clang:latest:14.0"
          export FINALPACKAGE=1
          export THEOS_PACKAGE_SCHEME=rootless
          
          # Display environment
          echo "Build Environment:"
          echo "THEOS: $THEOS"
          echo "ARCHS: $ARCHS"
          echo "TARGET: $TARGET"
          echo "PWD: $(pwd)"
          
          # Clean and build
          echo "Starting build process..."
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
          # Create output directory
          mkdir -p build_output
          
          # Copy dylib files
          if find .theos/obj/ -name "*.dylib" 2>/dev/null | grep -q .; then
            find .theos/obj/ -name "*.dylib" -exec cp {} build_output/ \;
            echo "Copied .dylib files:"
            ls -la build_output/
          else
            echo "Warning: No .dylib files found in .theos/obj/"
          fi
          
          # Copy deb packages if they exist
          if [ -d "packages" ] && find packages -name "*.deb" 2>/dev/null | grep -q .; then
            cp packages/*.deb build_output/ 2>/dev/null || true
            echo "Copied .deb files:"
            ls -la build_output/
          else
            echo "No .deb packages found (this is normal for dylib-only builds)"
          fi
          
          # List all build outputs
          echo "Final build output:"
          ls -lah build_output/

      - name: Create GitHub Release
        id: create_release
        run: |
          echo "Creating draft release v${{ github.run_number }}"

      - name: Upload to Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "YouTube-X Build #${{ github.run_number }}"
          draft: true
          prerelease: false
          files: |
            build_output/YouTubeX.dylib
            build_output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "Build Number: ${{ github.run_number }}"
          echo "Tag: v${{ github.run_number }}"
          echo "Status: ${{ job.status }}"
          echo "================================"
